- name: Checkout code
  uses: actions/checkout@v4   # ارتقا به نسخه جدیدتر

- name: Set up JDK 17
  uses: actions/setup-java@v4
  with:
    java-version: '17'
    distribution: 'temurin'

- name: Grant execute permission for gradlew
  run: chmod +x ./gradlew   # اگر gradlew در ریشه است

- name: Build with Gradle
  run: ./gradlew build
gradle wrapper --gradle-version 8.9
