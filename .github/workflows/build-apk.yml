name: Build Barbarg APK

'on':
  workflow_dispatch:
  push:
    branches: [main, master, version-2.2-dashboard]
  pull_request:
    branches: [main, master]

permissions:
  actions: read
  contents: read
concurrency:
  group: barbarg-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android lint, tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # Use an installed Gradle distribution because this repository does not
      # yet contain the generated Gradle wrapper JAR.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project layout
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ir/barbarg/auto/MainActivity.kt

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Barbarg-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
